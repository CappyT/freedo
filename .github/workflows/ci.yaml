name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run embed
      # The daemon embeds the build. The check mounts it under a random path prefix, as
      # Home Assistant ingress does, and runs it in Chrome.
      - run: go build -o "$RUNNER_TEMP/freedo" ../cmd/freedo
      - run: npm run prefix-check
        env:
          FREEDO_BIN: ${{ runner.temp }}/freedo
          REQUIRE_BROWSER: "1"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --no-project --python 3.14 --with pytest-homeassistant-custom-component pytest homeassistant/tests

  firmware:
    uses: ./.github/workflows/firmware.yaml
    permissions:
      contents: read

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [daemon, addon]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
