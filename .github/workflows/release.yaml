name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: freedo
            target: daemon
          - image: freedo-addon
            target: addon
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The tag, the add-on and the integration share one version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          addon=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' addon/config.yaml)
          integration=$(jq -r .version custom_components/freedo/manifest.json)
          if [ "v$integration" != "$TAG" ]; then
            echo "::error::tag '$TAG', manifest.json '$integration'"
            exit 1
          fi
          # A pre-release (vX.Y.Z-beta.N) leaves the add-on on the last stable version.
          case "$TAG" in
            *-*) ;;
            *)
              if [ "v$addon" != "$TAG" ]; then
                echo "::error::tag '$TAG', addon/config.yaml '$addon'"
                exit 1
              fi
              ;;
          esac
      - name: Name the image and the tags
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}"
          # latest names the newest stable image, beta the newest pre-release.
          case "$TAG" in
            *-*) moving=beta ;;
            *) moving=latest ;;
          esac
          {
            echo "tags<<EOF"
            echo "${name}:${TAG#v}"
            echo "${name}:${moving}"
            echo "EOF"
            echo "version=${TAG#v}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  firmware:
    uses: ./.github/workflows/firmware.yaml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  # The daemon binaries come out of the images the images job just pushed, so a
  # release ships the exact bytes of the container and one build serves both.
  binaries:
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the daemon binary of each platform from its image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freedo:${TAG#v}"
          for arch in amd64 arm64; do
            id=$(docker create --platform "linux/${arch}" "$image")
            docker cp "$id:/usr/local/bin/freedo" "dist/freedo-linux-${arch}"
            docker rm "$id"
          done
          (cd dist && sha256sum -- freedo-linux-amd64 freedo-linux-arm64 > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: daemon-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [images, firmware, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: firmware
          path: firmware
      - uses: actions/download-artifact@v8.0.2
        with:
          name: daemon-binaries
          path: binaries
      - name: Publish the GitHub release that HACS reads, with the firmware and the daemon binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # One SHA256SUMS covers every released file. run.sh checks the line of
          # the daemon binary it downloads.
          mkdir dist
          cp firmware/*.bin binaries/freedo-linux-* dist/
          cat firmware/SHA256SUMS binaries/SHA256SUMS > dist/SHA256SUMS
          # HACS offers a pre-release only to users who show beta versions.
          case "$TAG" in
            *-*) pre=--prerelease ;;
            *) pre=--latest ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "$pre" dist/*
