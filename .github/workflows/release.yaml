name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: freedo
            target: daemon
          - image: freedo-addon
            target: addon
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The tag, the add-on and the integration share one version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          addon=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' addon/config.yaml)
          integration=$(jq -r .version custom_components/freedo/manifest.json)
          if [ "v$addon" != "$TAG" ] || [ "$integration" != "$addon" ]; then
            echo "::error::tag '$TAG', addon/config.yaml '$addon', manifest.json '$integration'"
            exit 1
          fi
      - name: Name the image and the tags
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}"
          {
            echo "tags<<EOF"
            echo "${name}:${TAG#v}"
            echo "${name}:latest"
            echo "EOF"
            echo "version=${TAG#v}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  firmware:
    uses: ./.github/workflows/firmware.yaml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  release:
    needs: [images, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: firmware
          path: dist
      - name: Publish the GitHub release that HACS reads, with the firmware files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
