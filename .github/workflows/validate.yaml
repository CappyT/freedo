name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [addon, addon-beta]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: frenck/action-app-linter@v2
        with:
          path: ./${{ matrix.path }}

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The add-ons and the integration follow the version rules
        run: .github/scripts/check-versions.sh
