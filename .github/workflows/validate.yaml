name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: frenck/action-app-linter@v2
        with:
          path: ./addon

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The add-on and the integration share one version
        run: |
          addon=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' addon/config.yaml)
          integration=$(jq -r .version custom_components/freedo/manifest.json)
          # A pre-release of the integration runs ahead of the add-on, which follows
          # the stable releases only.
          case "$integration" in
            *-*) ok=$([ -n "$addon" ] && [ "${addon#*-}" = "$addon" ] && echo y) ;;
            *) ok=$([ -n "$addon" ] && [ "$addon" = "$integration" ] && echo y) ;;
          esac
          if [ "$ok" != y ]; then
            echo "::error::addon/config.yaml says '$addon', manifest.json says '$integration'"
            exit 1
          fi
