name: Publish fork add-on

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "addon/**"
      - "addon-beta/**"
      - "assets/brand/**"
      - "cc1101/**"
      - "cmd/**"
      - "dashboard/**"
      - "internal/**"
      - "tado/**"
      - ".github/workflows/publish-fork-addon.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read add-on versions
        id: versions
        run: |
          stable=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' addon/config.yaml)
          beta=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' addon-beta/config.yaml)
          test -n "$stable"
          test -n "$beta"
          {
            echo "stable=$stable"
            echo "beta=$beta"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: addon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xrobprox/freedo-addon:${{ steps.versions.outputs.stable }}
            ghcr.io/xrobprox/freedo-addon:${{ steps.versions.outputs.beta }}
            ghcr.io/xrobprox/freedo-addon:latest
            ghcr.io/xrobprox/freedo-addon:beta
            ghcr.io/xrobprox/freedo-addon:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.versions.outputs.stable }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.versions.outputs.date }}
