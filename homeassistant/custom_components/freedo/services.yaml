boost:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    "on":
      default: true
      selector:
        boolean:

set_overlay:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    hvac_mode:
      default: heat
      selector:
        select:
          options:
            - heat
            - "off"
          translation_key: overlay_hvac_mode
    temperature:
      selector:
        number:
          min: 5
          max: 25
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    end_rule:
      default: manual
      selector:
        select:
          options:
            - manual
            - timer
            - until_next
          translation_key: overlay_end_rule
    duration:
      selector:
        duration:

get_schedule:
  target:
    entity:
      integration: freedo
      domain: climate

set_schedule:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    programs:
      required: true
      example: >-
        [{"days": ["mon", "tue", "wed", "thu", "fri"], "entries":
        [{"time": "00:00", "temperature": 17}, {"time": "06:30", "temperature": 21},
        {"time": "22:00", "temperature": 17}]}, {"days": ["sat", "sun"], "entries":
        [{"time": "00:00", "temperature": 18}, {"time": "08:00", "temperature": 21}]}]
      selector:
        object:

copy_schedule:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    to:
      required: true
      selector:
        entity:
          integration: freedo
          domain: climate
          multiple: true

boost_all:
  fields:
    "on":
      default: true
      selector:
        boolean:

resume_all:
