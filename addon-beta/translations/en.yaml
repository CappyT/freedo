configuration:
  serial_port:
    name: Serial port
    description: >-
      The USB serial port of the ESP32 radio bridge. Leave it empty to run the
      daemon without a radio.
  api_token:
    name: API token
    description: >-
      The bearer token of the HTTP API. Leave it empty and the add-on creates a
      token and keeps it in its data folder.
  transmit:
    name: Transmit
    description: >-
      Send frames on air. Off means dry-run. Switch the commercial bridge off
      before you turn this on.
  import_stable_state:
    name: Import the stable state again
    description: >-
      At the next start, replace the state of this add-on with the last export
      of the stable freedo add-on. The add-on keeps a copy of the replaced state.
      Turn it off after the import.
