configuration:
  serial_port:
    name: Port série
    description: >-
      Le port série USB du pont radio ESP32. Laissez-le vide pour exécuter le
      démon sans radio.
  api_token:
    name: Jeton d'API
    description: >-
      Le jeton Bearer de l'API HTTP. Si vous le laissez vide, l'application crée
      un jeton et le conserve dans son dossier de données.
  transmit:
    name: Émission
    description: >-
      Envoie des trames par radio. Désactivé signifie dry-run. Éteignez la
      passerelle commerciale avant d'activer cette option.
  import_stable_state:
    name: Importer de nouveau l'état stable
    description: >-
      Au prochain démarrage, remplace l'état de ce module par le dernier export
      du module freedo stable. Le module garde une copie de l'état remplacé.
      Désactivez l'option après l'import.
