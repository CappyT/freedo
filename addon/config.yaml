name: freedo
version: "0.6.0"
slug: freedo
description: Local coordinator for tado 868 MHz heating devices
url: https://github.com/CappyT/freedo
image: ghcr.io/cappyt/freedo-addon
arch:
  - aarch64
  - amd64
stage: experimental
startup: services
backup: cold
ingress: true
ingress_port: 18080
panel_icon: mdi:radiator
panel_title: freedo
discovery:
  - freedo
map:
  - type: share
    read_only: false
timeout: 30
ports:
  18080/tcp: 18080
ports_description:
  18080/tcp: HTTP API
options:
  transmit: false
schema:
  serial_port: device(subsystem=tty)?
  api_token: password?
  transmit: bool
