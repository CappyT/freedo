boost:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    "on":
      default: true
      selector:
        boolean:

set_overlay:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    hvac_mode:
      default: heat
      selector:
        select:
          options:
            - heat
            - "off"
          translation_key: overlay_hvac_mode
    temperature:
      selector:
        number:
          min: 5
          max: 25
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    end_rule:
      default: manual
      selector:
        select:
          options:
            - manual
            - timer
            - until_next
            - until_auto_change
          translation_key: overlay_end_rule
    duration:
      selector:
        duration:
          enable_day: true

set_window:
  target:
    entity:
      integration: freedo
      domain: climate
  fields:
    open:
      default: true
      selector:
        boolean:

get_schedule:
  target:
    entity:
      integration: freedo
      domain:
        - climate
        - water_heater

set_schedule:
  target:
    entity:
      integration: freedo
      domain:
        - climate
        - water_heater
  fields:
    programs:
      required: true
      example: >-
        [{"days": ["mon", "tue", "wed", "thu", "fri"], "entries":
        [{"time": "00:00", "temperature": 17}, {"time": "06:30", "temperature": 21},
        {"time": "22:00", "temperature": 17}]}, {"days": ["sat", "sun"], "entries":
        [{"time": "00:00", "temperature": 18}, {"time": "08:00", "temperature": 21}]}]
      selector:
        object:

copy_schedule:
  target:
    entity:
      integration: freedo
      domain:
        - climate
        - water_heater
  fields:
    to:
      required: true
      selector:
        entity:
          integration: freedo
          domain:
            - climate
            - water_heater
          multiple: true

boost_all:
  fields:
    "on":
      default: true
      selector:
        boolean:

resume_all:

calibrate_gas_meter:
  fields:
    value:
      required: true
      selector:
        number:
          min: 0
          max: 1000000000
          step: 0.001
          mode: box
    estimate:
      selector:
        number:
          min: 0
          max: 1000000000
          step: 0.001
          mode: box
    at:
      selector:
        datetime:
    replaced:
      default: false
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: freedo

undo_gas_meter_reading:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: freedo

pair:
  fields:
    device:
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: freedo
